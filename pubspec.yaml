publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  get: ^4.6.6
  expansion_tile_card: ^3.0.0
  http: ^1.2.1
  shared_preferences: ^2.2.3
  flutter_easyloading: ^3.0.5
  fluttertoast: ^8.2.5
